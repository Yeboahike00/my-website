<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="860" height="660" fill="#fff" stroke="#333"/>
  <text x="450" y="50" font-size="16" text-anchor="middle">Simulation Flowchart</text>

  <!-- Flow boxes -->
  <rect x="100" y="90" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="120" font-size="12" text-anchor="middle">Build Topology</text>
  <rect x="100" y="170" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="200" font-size="12" text-anchor="middle">Configure VLANs & Devices</text>
  <rect x="100" y="250" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="280" font-size="12" text-anchor="middle">Configure WLC & RADIUS</text>
  <rect x="100" y="330" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="360" font-size="12" text-anchor="middle">Run Tests (Auth, QoS, Roaming)</text>
  <rect x="100" y="410" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="440" font-size="12" text-anchor="middle">Collect Logs & Metrics</text>
  <rect x="100" y="490" width="200" height="50" fill="#eaf2ff" stroke="#333"/><text x="200" y="520" font-size="12" text-anchor="middle">Analyze & Plot Graphs</text>

  <!-- Arrows -->
  <line x1="200" y1="140" x2="200" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="200" y1="220" x2="200" y2="250" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="200" y1="300" x2="200" y2="330" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="200" y1="380" x2="200" y2="410" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="200" y1="460" x2="200" y2="490" stroke="#333" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
